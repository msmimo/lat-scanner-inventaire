<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Configuration — LAT Scanner Inventaire</title>
<link rel="stylesheet" href="shared/style.css">
</head>
<body>
<header class="lat-header">
  <h1>LAT Scanner Inventaire</h1>
  <nav class="lat-nav">
    <a href="index.html">Accueil</a>
    <a href="scanner.html">Scanner</a>
    <a href="postes.html">Postes</a>
    <a href="pieces.html">Pièces</a>
    <a href="entrepot.html">Entrepôt Huot</a>
    <a href="historique.html">Historique</a>
    <a href="config.html" class="actif">Configuration</a>
  </nav>
</header>
<main>
  <div class="carte">
    <h2>Tables</h2>
    <div id="liste-tables"></div>
    <label>Nom de la table</label>
    <input id="nouvelle-table-nom" placeholder="ex. TABLE-1">
    <label>Description</label>
    <input id="nouvelle-table-desc" placeholder="optionnel">
    <button onclick="creerTable()">Ajouter la table</button>
  </div>

  <div class="carte">
    <h2>Moules / Sièges</h2>
    <p style="font-size:0.85rem;color:#666">Numéro pair = moule, numéro impair = siège (règle vérifiée automatiquement).</p>
    <div id="liste-moules-sieges"></div>
    <label>Numéro</label>
    <input id="nouveau-numero" type="number" inputmode="numeric">
    <label>Type</label>
    <select id="nouveau-type">
      <option value="moule">Moule (pair)</option>
      <option value="siege">Siège (impair)</option>
    </select>
    <button onclick="creerMouleSiege()">Ajouter</button>
  </div>

  <div class="carte">
    <h2>Positions</h2>
    <div id="liste-positions"></div>
    <label>Table</label>
    <select id="position-table"></select>
    <label>Code de position</label>
    <input id="position-code" placeholder="ex. 1EFN">
    <label>Moule / siège associé</label>
    <select id="position-moule-siege"></select>
    <button onclick="creerPosition()">Ajouter la position</button>
  </div>
</main>
<script src="shared/api.js"></script>
<script>
let tablesCache = [];
let mouleSiegeCache = [];

async function chargerTout() {
  tablesCache = await sbSelect('tables_travail', '*&order=nom');
  mouleSiegeCache = await sbSelect('moules_sieges', '*&order=numero');
  const positions = await sbSelect('positions', '*&order=code_position');

  document.getElementById('liste-tables').innerHTML = tablesCache.map(t =>
    `<div>${t.nom} — ${t.description || ''}</div>`
  ).join('') || '<p>Aucune table.</p>';

  document.getElementById('liste-moules-sieges').innerHTML = mouleSiegeCache.map(m =>
    `<div>#${m.numero} — ${m.type === 'moule' ? 'Moule' : 'Siège'}</div>`
  ).join('') || '<p>Aucun moule/siège.</p>';

  document.getElementById('liste-positions').innerHTML = positions.map(p => {
    const table = tablesCache.find(t => t.id === p.table_id);
    const ms = mouleSiegeCache.find(m => m.id === p.moule_siege_id);
    return `<div>${table ? table.nom : '?'} / ${p.code_position} — ${ms ? '#' + ms.numero : 'sans moule/siège'}</div>`;
  }).join('') || '<p>Aucune position.</p>';

  document.getElementById('position-table').innerHTML = tablesCache.map(t =>
    `<option value="${t.id}">${t.nom}</option>`
  ).join('');
  document.getElementById('position-moule-siege').innerHTML =
    '<option value="">Aucun</option>' +
    mouleSiegeCache.map(m => `<option value="${m.id}">#${m.numero} (${m.type})</option>`).join('');
}

async function creerTable() {
  const nom = document.getElementById('nouvelle-table-nom').value.trim();
  const description = document.getElementById('nouvelle-table-desc').value.trim();
  if (!nom) return alert('Le nom de la table est requis.');
  await sbInsert('tables_travail', { nom, description: description || null });
  document.getElementById('nouvelle-table-nom').value = '';
  document.getElementById('nouvelle-table-desc').value = '';
  await chargerTout();
}

async function creerMouleSiege() {
  const numero = parseInt(document.getElementById('nouveau-numero').value, 10);
  const type = document.getElementById('nouveau-type').value;
  if (!numero) return alert('Le numéro est requis.');
  const estPair = numero % 2 === 0;
  if (type === 'moule' && !estPair) return alert('Un moule doit avoir un numéro pair.');
  if (type === 'siege' && estPair) return alert('Un siège doit avoir un numéro impair.');
  try {
    await sbInsert('moules_sieges', { numero, type });
    document.getElementById('nouveau-numero').value = '';
    await chargerTout();
  } catch (e) {
    alert('Erreur : ' + e.message);
  }
}

async function creerPosition() {
  const table_id = document.getElementById('position-table').value;
  const code_position = document.getElementById('position-code').value.trim();
  const moule_siege_id = document.getElementById('position-moule-siege').value || null;
  if (!table_id) return alert('Créez d\'abord une table.');
  if (!code_position) return alert('Le code de position est requis.');
  await sbInsert('positions', { table_id, code_position, moule_siege_id });
  document.getElementById('position-code').value = '';
  await chargerTout();
}

chargerTout();
</script>
</body>
</html>
