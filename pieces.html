<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pièces — LAT Scanner Inventaire</title>
<link rel="stylesheet" href="shared/style.css">
</head>
<body>
<header class="lat-header">
  <h1>LAT Scanner Inventaire</h1>
  <nav class="lat-nav">
    <a href="index.html">Accueil</a>
    <a href="scanner.html">Scanner</a>
    <a href="postes.html">Postes</a>
    <a href="pieces.html" class="actif">Pièces</a>
    <a href="entrepot.html">Entrepôt Huot</a>
    <a href="historique.html">Historique</a>
    <a href="config.html">Configuration</a>
  </nav>
</header>
<main>
  <div class="carte">
    <label>Filtrer par statut</label>
    <select id="filtre-statut">
      <option value="">Tous</option>
    </select>
    <label>Rechercher un No. pièce</label>
    <input id="filtre-recherche" placeholder="ex. 1234">
  </div>
  <div class="carte">
    <table class="tableau-lat">
      <thead><tr><th>No. pièce</th><th>Statut</th><th>Position</th><th>Modifié le</th><th></th></tr></thead>
      <tbody id="corps-tableau"></tbody>
    </table>
  </div>
</main>
<script src="shared/api.js"></script>
<script>
let toutesPieces = [];
let positionsParId = {};

function classeBadge(statut) {
  if (statut === 'Inventaire - Prêt') return 'pret';
  if (statut === 'Mise en production') return 'production';
  if (statut === 'Inventaire - À entretenir') return 'entretien';
  if (statut === 'Chez Huot') return 'huot';
  if (statut === 'Remisée - Rebutée') return 'rebutee';
  return '';
}

async function init() {
  document.getElementById('filtre-statut').innerHTML += STATUTS.map(s => `<option value="${s}">${s}</option>`).join('');
  document.getElementById('filtre-statut').addEventListener('change', afficher);
  document.getElementById('filtre-recherche').addEventListener('input', afficher);

  const positions = await sbSelect('positions', '*');
  positions.forEach(p => positionsParId[p.id] = p);

  await recharger();
}

async function recharger() {
  toutesPieces = await sbSelect('pieces', '*&order=no_piece');
  afficher();
}

function afficher() {
  const statutFiltre = document.getElementById('filtre-statut').value;
  const recherche = document.getElementById('filtre-recherche').value.trim().toLowerCase();
  const filtrees = toutesPieces.filter(p =>
    (!statutFiltre || p.statut === statutFiltre) &&
    (!recherche || p.no_piece.toLowerCase().includes(recherche))
  );

  document.getElementById('corps-tableau').innerHTML = filtrees.map(p => {
    const position = p.position_id ? positionsParId[p.position_id] : null;
    return `<tr>
      <td>${p.no_piece}</td>
      <td><span class="badge ${classeBadge(p.statut)}">${p.statut}</span></td>
      <td>${position ? position.code_position : '—'}</td>
      <td>${p.updated_at ? new Date(p.updated_at).toLocaleString('fr-CA') : ''}</td>
      <td><button class="secondaire" style="width:auto" onclick="modifierStatut('${p.id}')">Changer statut</button></td>
    </tr>`;
  }).join('') || '<tr><td colspan="5">Aucune pièce.</td></tr>';
}

async function modifierStatut(pieceId) {
  const piece = toutesPieces.find(p => p.id === pieceId);
  const choix = STATUTS.map((s, i) => `${i + 1}. ${s}`).join('\n');
  const reponse = prompt(`Nouveau statut pour ${piece.no_piece} :\n${choix}`, '');
  const index = parseInt(reponse, 10) - 1;
  if (isNaN(index) || !STATUTS[index]) return;
  const nouveauStatut = STATUTS[index];
  if (nouveauStatut === piece.statut) return;

  const raison = prompt('Raison du changement de statut (optionnel) :') || null;
  const ancienStatut = piece.statut;

  await sbUpdate('pieces', piece.id, {
    statut: nouveauStatut,
    position_id: nouveauStatut === 'Mise en production' ? piece.position_id : null
  });
  await enregistrerHistorique({
    piece,
    ancienStatut,
    nouveauStatut,
    typeAction: 'modification_statut',
    position: piece.position_id ? positionsParId[piece.position_id] : null,
    notes: raison
  });
  await enregistrerAudit({
    typeEntite: 'pieces',
    entiteId: piece.id,
    action: 'modification_statut',
    avant: { statut: ancienStatut },
    apres: { statut: nouveauStatut },
    raison
  });
  await recharger();
}

init();
</script>
</body>
</html>
