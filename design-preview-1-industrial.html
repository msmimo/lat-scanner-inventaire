<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>设计1：极简工业风</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Roboto Condensed', 'Arial Narrow', sans-serif;
  background: #1a1a1a;
  color: #ffffff;
  min-height: 100vh;
  padding-bottom: 80px;
}

/* Header */
.header {
  background: #000;
  padding: 16px;
  text-align: center;
  border-bottom: 3px solid #ffd700;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 2px;
}

/* Legend */
.legend {
  display: flex;
  gap: 12px;
  padding: 16px;
  background: #2a2a2a;
  border-bottom: 1px solid #444;
  font-size: 13px;
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.legend-box { width: 24px; height: 24px; border: 2px solid #666; }

/* Position Grid */
.position-grid {
  padding: 30px 20px;
  text-align: center;
}
.grid-label {
  font-size: 14px;
  color: #999;
  margin-bottom: 16px;
  letter-spacing: 4px;
}
.position-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}
.position-box {
  aspect-ratio: 1;
  background: #333;
  border: 3px solid #555;
  border-radius: 8px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  font-size: 28px;
  font-weight: 700;
  cursor: pointer;
  transition: all 0.2s;
}
.position-box:active { transform: scale(0.95); }
.position-box.scanned { background: #00ff00; color: #000; border-color: #00ff00; }
.position-box.selected { background: #ffd700; color: #000; border-color: #ffd700; }

/* Action Panel */
.action-panel {
  padding: 20px;
  background: #2a2a2a;
  margin: 0 16px;
  border-radius: 12px;
  border: 2px solid #444;
}
.active-tag {
  display: inline-block;
  background: #ffd700;
  color: #000;
  padding: 8px 20px;
  border-radius: 6px;
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 20px;
}
.btn-scan {
  width: 100%;
  height: 80px;
  background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
  color: #000;
  border: none;
  border-radius: 12px;
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 12px;
  cursor: pointer;
  box-shadow: 0 6px 0 #b8a000;
}
.btn-scan:active {
  transform: translateY(4px);
  box-shadow: 0 2px 0 #b8a000;
}
.btn-manual {
  width: 100%;
  height: 60px;
  background: #444;
  color: #fff;
  border: 2px solid #666;
  border-radius: 8px;
  font-size: 18px;
  font-weight: 600;
  cursor: pointer;
}

/* Bottom Nav */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #000;
  border-top: 3px solid #ffd700;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  height: 70px;
}
.nav-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  color: #999;
  border: none;
  background: transparent;
  cursor: pointer;
}
.nav-item.active { color: #ffd700; }
.nav-icon { font-size: 24px; margin-bottom: 4px; }
</style>
</head>
<body>

<div class="header">
  🏭 LAT SCANNER DC74
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-box" style="background:#333"></div>Non scanné</div>
  <div class="legend-item"><div class="legend-box" style="background:#ffd700"></div>Sélectionné</div>
  <div class="legend-item"><div class="legend-box" style="background:#00ff00"></div>Enregistré</div>
</div>

<div class="position-grid">
  <div class="grid-label">— NORD —</div>
  <div class="position-row">
    <div class="position-box">M1</div>
    <div class="position-box">M2</div>
    <div class="position-box scanned">M3</div>
    <div class="position-box">M4</div>
    <div class="position-box selected">M5</div>
  </div>
  <div class="position-row">
    <div class="position-box">S1</div>
    <div class="position-box">S2</div>
    <div class="position-box">S3</div>
    <div class="position-box">S4</div>
    <div class="position-box">S5</div>
  </div>
  <div class="grid-label">— SUD —</div>
</div>

<div class="action-panel">
  <div class="active-tag">M5</div>
  <button class="btn-scan">📷 SCANNER LE CODE</button>
  <button class="btn-manual">✎ Saisie manuelle</button>
</div>

<nav class="bottom-nav">
  <button class="nav-item active">
    <span class="nav-icon">📷</span>
    <span>Scan</span>
  </button>
  <button class="nav-item">
    <span class="nav-icon">📊</span>
    <span>Dashboard</span>
  </button>
  <button class="nav-item">
    <span class="nav-icon">📦</span>
    <span>Pièces</span>
  </button>
  <button class="nav-item">
    <span class="nav-icon">🏭</span>
    <span>Huot</span>
  </button>
</nav>

</body>
</html>
