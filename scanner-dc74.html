<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>DC74 Scanner</title>
<style>
  :root {
    --bg: #ffffff;
    --bg2: #f5f5f5;
    --bg3: #ebebeb;
    --border: #d0d0d0;
    --accent: #c87d10;
    --purple: #5a4fb0;
    --green: #2e9e56;
    --red: #c03030;
    --strip: #cccccc;
    --strip-active: #5a4fb0;
    --strip-fresh: #2e9e56;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; background: var(--bg); color: #000; min-height: 100vh; font-size: 16px; }
  .container { padding: 16px; max-width: 600px; margin: 0 auto; }

  /* Header */
  .header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 2px solid var(--border); }
  .header-badge { background: var(--accent); color: #fff; font-size: 26px; font-weight: 900; padding: 8px 18px; border-radius: 6px; letter-spacing: 0.08em; }
  .header-title { font-size: 15px; font-weight: 600; color: #000; text-transform: uppercase; letter-spacing: 0.06em; }

  /* Legend */
  .legend { display: flex; gap: 16px; margin-bottom: 16px; padding: 10px 14px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; flex-wrap: wrap; }
  .legend-item { display: flex; align-items: center; gap: 7px; font-size: 13px; color: #000; font-weight: 500; }
  .legend-swatch { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }

  /* Table plan */
  .table-section { margin-bottom: 20px; }
  .dir-label { font-size: 13px; font-weight: 700; letter-spacing: 0.15em; color: #000; text-align: center; padding: 8px 0; text-transform: uppercase; }
  .position-row { display: flex; gap: 8px; justify-content: center; margin-bottom: 12px; }

  /* Position box */
  .position-box {
    flex: 1;
    max-width: 100px;
    aspect-ratio: 1;
    background: var(--strip);
    border: 2px solid #aaa;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }

  .position-box:active { opacity: 0.75; }
  .position-box.active { background: var(--strip-active); border-color: var(--purple); }
  .position-box.fresh { background: var(--strip-fresh); border-color: var(--green); }

  .position-label { font-size: 11px; font-weight: 700; color: #666; margin-bottom: 4px; }
  .position-code { font-size: 20px; font-weight: 900; color: #000; }
  .position-box.active .position-label,
  .position-box.active .position-code { color: #fff; }
  .position-box.fresh .position-label,
  .position-box.fresh .position-code { color: #fff; }

  .position-value {
    position: absolute;
    bottom: 4px;
    left: 4px;
    right: 4px;
    font-size: 9px;
    font-weight: 700;
    color: #fff;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Panel */
  .panel { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .panel-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .panel-label { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #555; }
  .panel-tag { font-size: 16px; font-weight: 700; color: #000; background: #fff; border: 2px solid var(--accent); padding: 4px 12px; border-radius: 6px; }
  .panel-empty { font-size: 16px; color: #888; font-style: italic; text-align: center; padding: 12px 0; }

  .status { font-size: 15px; margin-top: 10px; min-height: 22px; font-weight: 500; padding: 8px 12px; border-radius: 6px; }
  .status.ok  { color: var(--green); background: #edfaf3; }
  .status.err { color: var(--red);   background: #fdeaea; }

  /* Camera */
  .cam-area { position: relative; width: 100%; aspect-ratio: 4/3; background: #000; overflow: hidden; border-radius: 8px; border: 2px solid var(--border); }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .scan-overlay { position: absolute; inset: 0; pointer-events: none; }
  .scan-frame { position: absolute; inset: 0; border: 3px solid var(--accent); overflow: hidden; }
  .scan-line { position: absolute; left: 0; right: 0; height: 2px; background: var(--accent); animation: scanline 1.2s ease-in-out infinite; }
  @keyframes scanline { 0%,100%{top:5%} 50%{top:90%} }
  .found-flash { position: absolute; inset: 0; background: rgba(46,158,86,0.3); opacity: 0; transition: opacity 0.1s; }

  /* Buttons */
  .btn-row { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  button {
    font-family: inherit; font-size: 16px; font-weight: 600;
    padding: 14px 20px; border-radius: 8px;
    border: 2px solid var(--border); background: #fff; color: #000;
    cursor: pointer; transition: all 0.1s; min-height: 50px;
    -webkit-appearance: none;
  }
  button:active { opacity: 0.75; }
  button.primary { border-color: var(--purple); color: var(--purple); background: #f0eeff; }
  button.primary:active { background: var(--purple); color: #fff; }
  button.scan-big {
    flex: 1; font-size: 18px; font-weight: 700;
    background: var(--purple); color: #fff; border-color: var(--purple);
    min-height: 56px;
  }

  /* Input */
  .input-row { display: flex; gap: 10px; margin-top: 14px; }
  input[type=text] {
    flex: 1; font-family: inherit; font-size: 16px;
    padding: 14px 14px; border-radius: 8px;
    border: 2px solid var(--border); background: #fff; color: #000;
    outline: none; -webkit-appearance: none;
  }
  input[type=text]:focus { border-color: var(--purple); }
  input[type=text]::placeholder { color: #aaa; }

  /* Bottom nav */
  .bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: calc(60px + env(safe-area-inset-bottom));
    background: #fff;
    border-top: 1px solid #e5e7eb;
    display: flex;
    justify-content: space-around;
    align-items: flex-start;
    padding-top: 8px;
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 100;
  }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    background: none;
    border: none;
    color: #9ca3af;
    padding: 0;
    margin: 0;
    min-height: auto;
    transition: color 0.2s;
  }
  .nav-item.active { color: #1a2b45; }
  .nav-icon { font-size: 24px; }
  .nav-label { font-size: 11px; font-weight: 500; }

  body { padding-bottom: calc(70px + env(safe-area-inset-bottom)); }
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-badge">DC74</div>
    <div class="header-title">Système de scan QR</div>
  </div>

  <div class="legend">
    <div class="legend-item"><div class="legend-swatch" style="background:var(--strip)"></div>Non scanné</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--strip-active)"></div>Sélectionné</div>
    <div class="legend-item"><div class="legend-swatch" style="background:var(--strip-fresh)"></div>Enregistré</div>
  </div>

  <div class="table-section">
    <div class="dir-label">— NORD —</div>
    <div class="position-row">
      <div class="position-box" data-pos="M1" onclick="selectPosition('M1')">
        <div class="position-label">#1</div>
        <div class="position-code">M1</div>
        <div class="position-value" id="val-M1"></div>
      </div>
      <div class="position-box" data-pos="M2" onclick="selectPosition('M2')">
        <div class="position-label">#2</div>
        <div class="position-code">M2</div>
        <div class="position-value" id="val-M2"></div>
      </div>
      <div class="position-box" data-pos="M3" onclick="selectPosition('M3')">
        <div class="position-label">#3</div>
        <div class="position-code">M3</div>
        <div class="position-value" id="val-M3"></div>
      </div>
      <div class="position-box" data-pos="M4" onclick="selectPosition('M4')">
        <div class="position-label">#4</div>
        <div class="position-code">M4</div>
        <div class="position-value" id="val-M4"></div>
      </div>
      <div class="position-box" data-pos="M5" onclick="selectPosition('M5')">
        <div class="position-label">#5</div>
        <div class="position-code">M5</div>
        <div class="position-value" id="val-M5"></div>
      </div>
    </div>

    <div class="position-row">
      <div class="position-box" data-pos="S1" onclick="selectPosition('S1')">
        <div class="position-code">S1</div>
        <div class="position-value" id="val-S1"></div>
      </div>
      <div class="position-box" data-pos="S2" onclick="selectPosition('S2')">
        <div class="position-code">S2</div>
        <div class="position-value" id="val-S2"></div>
      </div>
      <div class="position-box" data-pos="S3" onclick="selectPosition('S3')">
        <div class="position-code">S3</div>
        <div class="position-value" id="val-S3"></div>
      </div>
      <div class="position-box" data-pos="S4" onclick="selectPosition('S4')">
        <div class="position-code">S4</div>
        <div class="position-value" id="val-S4"></div>
      </div>
      <div class="position-box" data-pos="S5" onclick="selectPosition('S5')">
        <div class="position-code">S5</div>
        <div class="position-value" id="val-S5"></div>
      </div>
    </div>
    <div class="dir-label">— SUD —</div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <div class="panel-label">Position active</div>
      <span class="panel-tag" id="active-tag" style="display:none"></span>
    </div>
    <p class="panel-empty" id="hint-text">Appuyez sur une position ci-dessus</p>
    <div id="scan-section" style="display:none">
      <div class="cam-area" id="cam-area" style="display:none">
        <video id="video" playsinline autoplay muted></video>
        <div class="scan-overlay">
          <div class="scan-frame">
            <div class="scan-line"></div>
            <div class="found-flash" id="found-flash"></div>
          </div>
        </div>
      </div>
      <div class="status" id="scan-status" style="display:none"></div>
      <div class="btn-row">
        <button class="scan-big" id="scan-btn" onclick="startScan()">▶ Scanner</button>
      </div>
      <div class="btn-row">
        <button class="primary" onclick="toggleManual()">✎ Saisie manuelle</button>
      </div>
      <div class="input-row" id="manual-row" style="display:none">
        <input type="text" id="manual-input" placeholder="Numéro de pièce…" inputmode="numeric"/>
        <button class="primary" onclick="saveManual()">OK</button>
      </div>
    </div>
  </div>

</div>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
  <button class="nav-item active">
    <span class="nav-icon">📍</span>
    <span class="nav-label">Scan</span>
  </button>
  <button class="nav-item" onclick="alert('Dashboard à venir')">
    <span class="nav-icon">📊</span>
    <span class="nav-label">Dashboard</span>
  </button>
  <button class="nav-item" onclick="alert('Pièces à venir')">
    <span class="nav-icon">📦</span>
    <span class="nav-label">Pièces</span>
  </button>
  <button class="nav-item" onclick="alert('Huot à venir')">
    <span class="nav-icon">🏭</span>
    <span class="nav-label">Huot</span>
  </button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="../shared/api.js"></script>
<script>
let activePosition = null;
let scanning = false, rafId = null, currentStream = null;
const canvas = document.createElement('canvas');
const ctx = canvas.getContext('2d', { willReadFrequently: true });
const dataStore = {};

function selectPosition(pos) {
  // Remove active from all
  document.querySelectorAll('.position-box').forEach(box => {
    box.classList.remove('active');
  });

  // Set active
  activePosition = pos;
  document.querySelector(`[data-pos="${pos}"]`).classList.add('active');

  // Update UI
  document.getElementById('active-tag').textContent = pos;
  document.getElementById('active-tag').style.display = '';
  document.getElementById('hint-text').style.display = 'none';
  document.getElementById('scan-section').style.display = '';

  // Show current value if exists
  const cur = dataStore[pos];
  const statusEl = document.getElementById('scan-status');
  if (cur) {
    statusEl.textContent = '▪ Valeur actuelle : ' + cur;
    statusEl.className = 'status ok';
    statusEl.style.display = '';
  } else {
    statusEl.style.display = 'none';
  }

  stopScan();
  document.getElementById('manual-row').style.display = 'none';

  // Haptic feedback
  if (navigator.vibrate) {
    navigator.vibrate(10);
  }
}

function flashGreen(pos) {
  const box = document.querySelector(`[data-pos="${pos}"]`);
  if (!box) return;
  box.classList.remove('active');
  box.classList.add('fresh');
  setTimeout(() => {
    // Keep green permanently
  }, 100);
}

function setStatus(text, type) {
  const el = document.getElementById('scan-status');
  el.textContent = text;
  el.className = 'status' + (type ? ' ' + type : '');
  el.style.display = text ? '' : 'none';
}

async function startScan() {
  if (!activePosition || scanning) return;
  document.getElementById('cam-area').style.display = '';
  setStatus('Démarrage caméra…', '');
  try {
    currentStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    const video = document.getElementById('video');
    video.srcObject = currentStream;
    await video.play();
    scanning = true;
    document.getElementById('scan-btn').textContent = '■ Arrêter';
    document.getElementById('scan-btn').onclick = stopScan;
    setStatus('Pointez le QR code vers la caméra…', '');
    tick(video);
  } catch(e) {
    setStatus('⚠️ HTTPS requis pour caméra. Utilisez la saisie manuelle.', 'err');
    document.getElementById('cam-area').style.display = 'none';
  }
}

function tick(video) {
  if (!scanning) return;
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    const scale = Math.min(1, 640 / (video.videoWidth || 640));
    const w = Math.round((video.videoWidth || 640) * scale);
    const h = Math.round((video.videoHeight || 480) * scale);
    if (canvas.width !== w) canvas.width = w;
    if (canvas.height !== h) canvas.height = h;
    ctx.drawImage(video, 0, 0, w, h);
    const result = jsQR(ctx.getImageData(0, 0, w, h).data, w, h, { inversionAttempts: 'attemptBoth' });
    if (result?.data) {
      document.getElementById('found-flash').style.opacity = '1';
      setTimeout(() => { document.getElementById('found-flash').style.opacity = '0'; }, 250);
      stopScan();
      saveValue(result.data);
      return;
    }
  }
  rafId = requestAnimationFrame(() => tick(video));
}

function stopScan() {
  scanning = false;
  if (rafId) { cancelAnimationFrame(rafId); rafId = null; }
  if (currentStream) { currentStream.getTracks().forEach(t => t.stop()); currentStream = null; }
  const video = document.getElementById('video');
  if (video) video.srcObject = null;
  document.getElementById('cam-area').style.display = 'none';
  document.getElementById('scan-btn').textContent = '▶ Scanner';
  document.getElementById('scan-btn').onclick = startScan;
}

function toggleManual() {
  const row = document.getElementById('manual-row');
  row.style.display = row.style.display === 'none' ? '' : 'none';
  if (row.style.display !== 'none') document.getElementById('manual-input').focus();
}

function saveManual() {
  const v = document.getElementById('manual-input').value.trim();
  if (!v || !activePosition) return;
  saveValue(v);
  document.getElementById('manual-input').value = '';
  document.getElementById('manual-row').style.display = 'none';
}

async function saveValue(value) {
  if (!activePosition) return;

  setStatus('Enregistrement…', '');

  // Save to data store
  dataStore[activePosition] = value;

  // Update display
  const valEl = document.getElementById('val-' + activePosition);
  if (valEl) valEl.textContent = value.slice(0, 6);

  // Flash green
  flashGreen(activePosition);

  // TODO: Save to Supabase here using shared/api.js functions

  setStatus('✓ Enregistré : ' + value, 'ok');

  // Auto-hide after 2 seconds
  setTimeout(() => {
    document.getElementById('scan-section').style.display = 'none';
    document.getElementById('active-tag').style.display = 'none';
    document.getElementById('hint-text').style.display = '';
    activePosition = null;
  }, 2000);
}
</script>
</body>
</html>
