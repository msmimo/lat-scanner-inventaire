<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LAT Scanner Inventaire</title>
<link rel="stylesheet" href="shared/style.css">
</head>
<body>
<header class="lat-header">
  <h1>LAT Scanner Inventaire</h1>
  <nav class="lat-nav">
    <a href="index.html" class="actif">Accueil</a>
    <a href="scanner.html">Scanner</a>
    <a href="postes.html">Postes</a>
    <a href="pieces.html">Pièces</a>
    <a href="entrepot.html">Entrepôt Huot</a>
    <a href="historique.html">Historique</a>
    <a href="config.html">Configuration</a>
  </nav>
</header>
<main>
  <div class="carte">
    <h2>Aperçu</h2>
    <p id="resume">Chargement...</p>
  </div>
  <div class="carte">
    <h2>Accès rapide</h2>
    <p><a href="scanner.html">→ Installer / remplacer une pièce sur un poste</a></p>
    <p><a href="entrepot.html">→ Expédier une pièce vers Huot</a></p>
    <p><a href="historique.html">→ Consulter l'historique ou un instantané par date</a></p>
  </div>
</main>
<script src="shared/api.js"></script>
<script>
async function chargerResume() {
  try {
    const pieces = await sbSelect('pieces', 'statut');
    const compte = {};
    STATUTS.forEach(s => compte[s] = 0);
    pieces.forEach(p => { compte[p.statut] = (compte[p.statut] || 0) + 1; });
    document.getElementById('resume').innerHTML = STATUTS.map(s =>
      `<div>${s} : <strong>${compte[s] || 0}</strong></div>`
    ).join('');
  } catch (e) {
    document.getElementById('resume').innerHTML = '<span class="erreur">Impossible de charger les données. Vérifiez la configuration Supabase dans shared/api.js.</span>';
  }
}
chargerResume();
</script>
</body>
</html>
